[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dflash-parc16"
version = "0.2.0"
description = "One-call global non-causal full16 correction for DFlash"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
experiment = [
  "accelerate==1.13.0",
  "datasets==4.8.4",
  "numpy==2.4.3",
  "pyarrow>=15",
  "pytest==9.0.3",
  "safetensors==0.7.0",
  "transformers==4.57.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
